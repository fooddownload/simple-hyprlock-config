background {
    monitor =
    path = $HOME/Downloads/starwars.png # Or blur your current wallpaper
    blur_passes = 3
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0f - 1.0f
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i>
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%H:%M')</span>"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = GoogleSansCode NFP ExtraBold
    position = 0, 80
    halign = center
    valign = center
}
